<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <style> .title { font: bold 20px sans-serif; } .axis { stroke: #333; stroke-width:1; } .grid { stroke: #ddd; stroke-width:1; } .label { font: 12px sans-serif; fill: #333; }</style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="20" y="30" class="title">Precision–Recall Curve (placeholder)</text>
  <g transform="translate(100,60)">
    <rect x="0" y="0" width="520" height="280" fill="#fafafa" stroke="#eee"/>
    <!-- grid lines -->
    <g stroke="#eee" stroke-width="1">
      <line x1="0" y1="56" x2="520" y2="56"/>
      <line x1="0" y1="112" x2="520" y2="112"/>
      <line x1="0" y1="168" x2="520" y2="168"/>
      <line x1="0" y1="224" x2="520" y2="224"/>
    </g>
    <!-- axes -->
    <line x1="0" y1="280" x2="520" y2="280" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="280" class="axis"/>
    <text x="260" y="310" class="label" text-anchor="middle">Recall</text>
    <text x="-40" y="140" class="label" transform="rotate(-90 -40,140)" text-anchor="middle">Precision</text>
    <!-- PR curve path -->
    <path d="M10,250 C80,170 160,120 240,90 C320,65 400,50 500,30" fill="none" stroke="#E45756" stroke-width="4" stroke-linecap="round"/>
    <!-- baseline -->
    <line x1="0" y1="280" x2="520" y2="280" stroke="#bbb" stroke-dasharray="4 4"/>
    <!-- legend -->
    <rect x="380" y="10" width="120" height="38" rx="4" fill="#fff" stroke="#eee" />
    <line x1="392" y1="30" x2="412" y2="30" stroke="#E45756" stroke-width="4"/>
    <text x="420" y="34" class="label">Model PR</text>
    <!-- AUC placeholder -->
    <text x="400" y="60" class="label">Average precision: 0.86 (placeholder)</text>
  </g>
  <text x="20" y="380" class="label">Generated as a placeholder image — replace with model-derived PR curve.</text>
</svg>
