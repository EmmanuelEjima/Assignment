<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <style> .title { font: bold 20px sans-serif; } .label { font: 12px sans-serif; fill: #333; } .bar-label { font: 11px sans-serif; fill: #fff; }</style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="20" y="30" class="title">Feature Importance (placeholder)</text>
  <!-- Bars -->
  <g transform="translate(100,60)">
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="500" height="250" fill="#fafafa" stroke="#eee"/>
      <!-- individual bars -->
      <rect x="20" y="30" width="60" height="180" rx="6" fill="#4C78A8"/>
      <text x="50" y="25" text-anchor="middle" class="label">Feat A</text>
      <rect x="110" y="90" width="60" height="120" rx="6" fill="#F58518"/>
      <text x="140" y="85" text-anchor="middle" class="label">Feat B</text>
      <rect x="200" y="50" width="60" height="160" rx="6" fill="#E45756"/>
      <text x="230" y="45" text-anchor="middle" class="label">Feat C</text>
      <rect x="290" y="140" width="60" height="70" rx="6" fill="#72B7B2"/>
      <text x="320" y="135" text-anchor="middle" class="label">Feat D</text>
      <rect x="380" y="20" width="60" height="190" rx="6" fill="#54A24B"/>
      <text x="410" y="15" text-anchor="middle" class="label">Feat E</text>
      <!-- values on top of bars -->
      <text x="50" y="28" text-anchor="middle" class="bar-label">0.45</text>
      <text x="140" y="88" text-anchor="middle" class="bar-label">0.30</text>
      <text x="230" y="48" text-anchor="middle" class="bar-label">0.40</text>
      <text x="320" y="138" text-anchor="middle" class="bar-label">0.12</text>
      <text x="410" y="18" text-anchor="middle" class="bar-label">0.50</text>
    </g>
  </g>
  <text x="20" y="380" class="label">Generated as a placeholder image — replace with real model output for publication-quality figures.</text>
</svg>
